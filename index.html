<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notice Board</title>
    <h2><b>I am taking a break 😊😂 muthafuka</b></h2>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Permanent+Marker&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --paper: #f5f0e8;
      --red: #e63946;
      --gold: #f4c542;
      --ink: #1a1a2e;
      --green: #2dc653;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 20px
        );
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 40px 20px;
    }

    .board {
      background: #2b1d0e;
      border: 6px solid #5c3a1e;
      border-radius: 4px;
      padding: 40px 30px;
      width: 100%;
      max-width: 680px;
      box-shadow:
        0 0 0 2px #8b5e3c,
        0 20px 60px rgba(0,0,0,0.8),
        inset 0 0 80px rgba(0,0,0,0.4);
      position: relative;
    }

    .board::before {
      content: "📌";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
    }

    /* ── PIN decorations ── */
    .pin {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .pin.tl { top: 12px; left: 16px; }
    .pin.tr { top: 12px; right: 16px; }
    .pin.bl { bottom: 12px; left: 16px; }
    .pin.br { bottom: 12px; right: 16px; }

    /* ── NOTICE SLIP ── */
    .notice {
      background: var(--paper);
      border-radius: 3px;
      padding: 30px 28px;
      position: relative;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.5),
        inset 0 0 30px rgba(0,0,0,0.04);
      transform: rotate(-0.8deg);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: rotate(-0.8deg) translateY(0); }
      50%       { transform: rotate(-0.8deg) translateY(-4px); }
    }

    .notice::before {
      content: '';
      position: absolute;
      top: 0; left: 30px;
      width: 2px; height: 100%;
      background: rgba(200, 80, 80, 0.35);
    }

    /* ruled lines */
    .notice::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        transparent,
        transparent 31px,
        rgba(100, 140, 200, 0.18) 31px,
        rgba(100, 140, 200, 0.18) 32px
      );
      pointer-events: none;
      border-radius: 3px;
    }

    .notice-header {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(230, 57, 70, 0.3);
    }

    /* ── MAIN MESSAGES ── */
    .message-1 {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.6rem;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .highlight {
      background: var(--gold);
      padding: 0 6px;
      border-radius: 2px;
      display: inline-block;
      transform: rotate(-1deg);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }

    .laugh-burst {
      display: block;
      font-size: 2.2rem;
      margin: 12px 0 20px;
      animation: shake 1.5s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(-2deg); }
      25%       { transform: rotate(2deg) scale(1.05); }
      75%       { transform: rotate(-1deg) scale(0.98); }
    }

    .divider {
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(100,140,200,0.3), transparent);
      margin: 20px 0;
    }

    .message-2 {
      font-family: 'Permanent Marker', cursive;
      font-size: 2.1rem;
      color: var(--red);
      position: relative;
      z-index: 1;
      line-height: 1.3;
    }

    .strikethrough {
      text-decoration: line-through;
      text-decoration-color: var(--red);
      text-decoration-thickness: 3px;
      opacity: 0.7;
      font-size: 1.3rem;
      display: inline;
    }

    .badge {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border-radius: 2px;
      margin-left: 8px;
      transform: rotate(2deg);
      vertical-align: middle;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #999;
      font-style: italic;
      text-align: right;
      position: relative;
      z-index: 1;
    }

    .stamp {
      position: absolute;
      bottom: 22px;
      right: 22px;
      width: 80px;
      height: 80px;
      border: 3px solid rgba(230, 57, 70, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.7rem;
      color: rgba(230, 57, 70, 0.55);
      text-align: center;
      letter-spacing: 0.05em;
      transform: rotate(-15deg);
      line-height: 1.2;
      pointer-events: none;
      z-index: 2;
    }

    .stamp::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(230, 57, 70, 0.3);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="board">
    <div class="pin tl"></div>
    <div class="pin tr"></div>
    <div class="pin bl"></div>
    <div class="pin br"></div>

    <div class="notice">

      <div class="notice-header">📋 &nbsp; Official Notice &nbsp; · &nbsp; Examination Hall</div>

      <!-- Message 1 -->
      <div class="message-1">
        Invigilator <span class="highlight">teyasoma</span>
      </div>
      <span class="laugh-burst">😂😂😂😂</span>

      <div class="divider"></div>

      <!-- Message 2 -->
      <div class="message-2">
        Nawangwe <span class="strikethrough">VC</span>
        <span class="badge">ZIII</span> 🤣
      </div>

      <div class="footer-note">— Posted by: Anonymous Student, MAK © 2026</div>

      <div class="stamp">NOT<br>OFFICIAL<br>😭</div>

    </div>
  </div>

</body>
</html>
